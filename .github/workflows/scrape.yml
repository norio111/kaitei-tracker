name: 診療報酬改定チェック

on:
  schedule:
    - cron: '0 0 * * *'   # 毎日 UTC 0:00 = JST 9:00
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v5

      - name: Python セットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 依存関係インストール
        run: pip install -r requirements.txt

      - name: 説明資料チェック
        run: python scraper/scrape_summary.py

      - name: 疑義解釈チェック
        run: python scraper/scrape_gigi.py

      - name: 変化があればコミット&プッシュ
        run: |
          git config user.name "kaitei-bot"
          git config user.email "kaitei-bot@users.noreply.github.com"
          git add db/
          if ! git diff --staged --quiet; then
            git commit -m "update: $(date +'%Y-%m-%d %H:%M') 診療報酬改定チェック"
            git push
          else
            echo "変化なし"
          fi
